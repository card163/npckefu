# 本地开发用 MySQL：docker compose up -d
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: npckefu
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
  # 多实例部署需要：REDIS_ADDR=127.0.0.1:6379
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  mysql-data:
