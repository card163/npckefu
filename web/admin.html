<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台</title>
<style>
:root{--pri:#2f6bff;--bg:#f0f2f5;--card:#fff;--line:#e5e7eb;--txt:#1f2937;--mut:#6b7280;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--dark:#1f2a44}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);background:var(--bg)}
button,input,select,textarea{font:inherit}
.btn{border:1px solid var(--line);background:#fff;color:var(--txt);padding:6px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.primary:hover{opacity:.9;color:#fff}
.btn.danger{color:var(--err)}.btn.danger:hover{border-color:var(--err);color:var(--err)}
.btn.sm{padding:2px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{width:100%;resize:vertical}
/* 登录 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1f2a44,#2f6bff)}
#login form{background:#fff;padding:32px;border-radius:12px;width:380px;max-width:92vw;display:flex;flex-direction:column;gap:14px}
#login h1{margin:0;font-size:20px}#login p{margin:0;color:var(--mut);font-size:12px}
#login .err{color:var(--err);min-height:20px;font-size:13px}
/* 外壳 */
.shell{display:flex;min-height:100vh}
.side{width:200px;background:var(--dark);color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0}
.side .brand{padding:18px 20px;color:#fff;font-weight:700;font-size:16px}
.side a{display:block;padding:11px 20px;color:#cbd5e1;text-decoration:none;border-left:3px solid transparent}
.side a:hover{background:#ffffff14}.side a.on{background:#ffffff1f;color:#fff;border-left-color:var(--pri)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.top h2{margin:0;font-size:17px}.top .who{color:var(--mut);display:flex;gap:12px;align-items:center}
.content{padding:20px 24px;flex:1}
@media(max-width:760px){.side{width:64px}.side .brand,.side a span{display:none}.side a{padding:11px;text-align:center}.content{padding:12px}}
/* 通用 */
.panel{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 2px #0000000d;margin-bottom:16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 2px #0000000d}
.card .l{color:var(--mut);font-size:13px}.card .v{font-size:28px;font-weight:700;margin:4px 0}.card .s{color:var(--mut);font-size:12px}
.card.warn .v{color:var(--warn)}.card.bad .v{color:var(--err)}.card.good .v{color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #f1f2f4;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px;background:#fafafa}tr.click{cursor:pointer}tr.click:hover{background:#f7f9ff}
.tablewrap{overflow-x:auto}
.empty{color:var(--mut);text-align:center;padding:26px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end;margin-top:14px}
.bar{background:#eef1f5;border-radius:4px;height:8px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--pri)}
.bar.full i{background:var(--err)}
.badge{white-space:nowrap;display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;background:#eef1f5;color:#475569}
.badge.active,.badge.done{background:#dcfce7;color:#166534}.badge.queued,.badge.pending{background:#fef3c7;color:#92400e}
.badge.bot{background:#e0e7ff;color:#3730a3}.badge.closed,.badge.dropped{background:#f1f5f9;color:#64748b}.badge.dead{background:#fee2e2;color:#991b1b}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:6px}.dot.on{background:var(--ok)}
.mut{color:var(--mut)}.star{color:#f5a623;letter-spacing:1px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.field label{font-weight:500}.field .hint{color:var(--mut);font-size:12px}
.field input,.field select{width:100%}
.dist{display:grid;grid-template-columns:36px 1fr 40px;gap:8px;align-items:center;margin:6px 0}
/* 弹窗 / 抽屉 / 提示 */
.mask{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:12px;padding:20px;width:480px;max-width:94vw;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 14px}
.drawer-mask{position:fixed;inset:0;background:#0005;z-index:40;display:flex;justify-content:flex-end}
.drawer{background:#fff;width:640px;max-width:100vw;height:100%;display:flex;flex-direction:column}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .body{flex:1;overflow:auto;padding:16px 18px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;margin-bottom:12px}.kv b{color:var(--mut);font-weight:400}
.chat{background:#f6f7fa;border-radius:8px;padding:12px;max-height:46vh;overflow:auto}
.msg{margin:8px 0;max-width:80%}.msg.r{margin-left:auto}.msg .meta{font-size:11px;color:var(--mut);margin-bottom:2px}.msg.r .meta{text-align:right}
.msg .b{background:#fff;border-radius:10px;padding:7px 11px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px #0001;display:inline-block;text-align:left}
.msg.r .b{background:#dbe7ff}.msg.sys{max-width:100%;text-align:center;color:var(--mut);font-size:12px}
.msg img{max-width:200px;max-height:200px;display:block;border-radius:6px}
#toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--dark);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 4px 14px #0003;max-width:360px;word-break:break-word}.toast.err{background:var(--err)}
.sec{margin:16px 0 6px;font-weight:600}
pre.code{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto;font-size:12px;margin:6px 0}
</style></head><body>
<div id="app"></div><div id="toasts"></div>
<script>
'use strict';
/* ============ 基础：DOM 构造（所有数据一律走文本节点，杜绝 innerHTML 注入）============ */
const h=(tag,attrs,...kids)=>{const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on'))e[k]=v;
    else if(['value','checked','disabled','selected','readOnly'].includes(k))e[k]=v;
    else e.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c instanceof Node?c:String(c))}
  return e};
// 原生 replaceChildren 会把 false/null/数组转成文字；put 与 h() 一样先过滤、展开
const put=(el,...kids)=>el.replaceChildren(...kids.flat(Infinity).filter(c=>c!=null&&c!==false));
const $app=document.getElementById('app');
const fmt=s=>s?new Date(s).toLocaleString('zh-CN',{hour12:false}):'-';
const hm=s=>new Date(s).toLocaleTimeString('zh-CN',{hour12:false});
const stars=n=>h('span',{class:'star'},'★'.repeat(n)+'☆'.repeat(5-n));
const STATUS={bot:'机器人接待',queued:'排队中',active:'接待中',closed:'已结束',pending:'待投递',done:'已送达',dead:'投递失败',dropped:'已丢弃'};
const badge=s=>h('span',{class:'badge '+s},STATUS[s]||s);
const fmtDur=sec=>{sec=Math.max(0,Math.round(sec));return sec<60?sec+' 秒':Math.floor(sec/60)+' 分 '+(sec%60)+' 秒'};
const IMG_URL=/^\/files\/[0-9a-f]{32}$/;

function toast(msg,kind){const t=h('div',{class:'toast '+(kind||'')},msg);document.getElementById('toasts').append(t);setTimeout(()=>t.remove(),kind==='err'?6000:3000)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已复制')}catch(e){toast('复制失败，请手动选择','err')}}

function modal(title,content,buttons,onClose){
  const mask=h('div',{class:'mask'});const close=()=>{mask.remove();if(onClose)onClose()};
  const btns=(buttons||[{text:'关闭'}]).map(b=>h('button',{class:'btn '+(b.kind||''),onclick:async ev=>{
    if(b.onclick){const bt=ev.currentTarget;bt.disabled=true;try{if(await b.onclick(close)===false){bt.disabled=false;return}}catch(e){toast(e.message,'err');bt.disabled=false;return}}
    close()}},b.text));
  mask.append(h('div',{class:'modal'},h('h3',{},title),content,h('div',{class:'row end'},btns)));
  mask.onmousedown=e=>{if(e.target===mask)close()};document.body.append(mask);return close}
const confirmBox=(msg,okText)=>new Promise(res=>modal('请确认',h('div',{},msg),[{text:'取消'},{text:okText||'确定',kind:'danger',onclick:()=>{res(true)}}],()=>res(false)))
const field=(label,input,hint)=>h('div',{class:'field'},h('label',{},label),input,hint&&h('span',{class:'hint'},hint));

/* ============ 认证与 API ============ */
const SS={get:()=>JSON.parse(sessionStorage.getItem('adm')||'null'),set:v=>sessionStorage.setItem('adm',JSON.stringify(v)),clear:()=>sessionStorage.removeItem('adm')};
let AUTH=SS.get(),TENANT=null,CLEANUP=null;

async function api(method,path,body){
  const r=await fetch(path,{method,headers:{'X-App-Key':AUTH.ak,'X-App-Secret':AUTH.sec,...(body!==undefined?{'Content-Type':'application/json'}:{})},body:body!==undefined?JSON.stringify(body):undefined});
  if(r.status===401){logout('登录已失效，请重新登录');throw new Error('登录已失效')}
  if(r.status===204)return null;
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error((j&&j.error)||('请求失败（'+r.status+'）')),{status:r.status});
  return j}
const safe=fn=>async(...a)=>{try{return await fn(...a)}catch(e){if(e.message!=='登录已失效')toast(e.message,'err');return false}};

function logout(msg){SS.clear();AUTH=null;TENANT=null;if(CLEANUP){CLEANUP();CLEANUP=null}showLogin(msg)}

function showLogin(msg){
  const ak=h('input',{placeholder:'App Key',required:true,autocomplete:'off'}),sec=h('input',{type:'password',placeholder:'App Secret',required:true,autocomplete:'off'});
  const err=h('div',{class:'err'},msg||'');
  const form=h('form',{onsubmit:async e=>{e.preventDefault();err.textContent='';
    try{ // 登录校验不走 api()：401 在这里表示"凭证错误"，而不是"登录已失效"
      const cred={ak:ak.value.trim(),sec:sec.value.trim()};
      const r=await fetch('/v1/tenant',{headers:{'X-App-Key':cred.ak,'X-App-Secret':cred.sec}});
      if(r.status===401){err.textContent='App Key 或 App Secret 不正确';return}
      if(!r.ok){err.textContent='登录失败（'+r.status+'）';return}
      AUTH=cred;TENANT=await r.json();SS.set(AUTH);showShell()
    }catch(x){err.textContent='无法连接服务器：'+x.message}}},
    h('h1',{},'在线客服 · 管理后台'),h('p',{},'使用租户的 App Key / App Secret 登录。Secret 仅保存在当前标签页，关闭即清除；请勿在不可信的设备上登录。'),
    ak,sec,err,h('button',{class:'btn primary'},'登录'));
  $app.replaceChildren(h('div',{id:'login'},form))}

/* ============ 外壳与路由 ============ */
const PAGES=[
  ['dashboard','概览','📊',pageDashboard],['sessions','会话','💬',pageSessions],['agents','坐席','🧑‍💼',pageAgents],
  ['faq','知识库','📚',pageFaq],['words','敏感词','🚫',pageWords],['ratings','评价','⭐',pageRatings],
  ['webhook','回调','🔔',pageWebhook],['settings','设置','⚙️',pageSettings],['access','接入','🔌',pageAccess]];

function showShell(){
  const nav=h('nav',{class:'side'},h('div',{class:'brand'},'客服管理后台'),PAGES.map(([k,t,i])=>h('a',{href:'#/'+k,'data-k':k},i+' ',h('span',{},t))));
  const title=h('h2',{}),content=h('div',{class:'content'});
  $app.replaceChildren(h('div',{class:'shell'},nav,h('div',{class:'main'},
    h('div',{class:'top'},title,h('div',{class:'who'},h('span',{},TENANT.name),h('button',{class:'btn sm',onclick:()=>logout()},'退出'))),content)));
  const route=async()=>{
    if(CLEANUP){CLEANUP();CLEANUP=null}
    const k=location.hash.replace(/^#\//,'')||'dashboard';const p=PAGES.find(x=>x[0]===k)||PAGES[0];
    nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.k===p[0]));title.textContent=p[1];
    content.replaceChildren(h('div',{class:'empty'},'加载中…'));
    const holder=h('div');
    try{const c=await p[3](holder);content.replaceChildren(holder);CLEANUP=c||null}
    catch(e){if(e.message!=='登录已失效')content.replaceChildren(h('div',{class:'empty'},'加载失败：'+e.message))}};
  window.onhashchange=route;route()}

/* ============ 概览 ============ */
async function pageDashboard(root){
  const cards=h('div',{class:'cards'}),agents=h('div',{class:'panel'}),queue=h('div',{class:'panel'});
  root.append(cards,h('div',{class:'two'},agents,queue));
  const card=(l,v,s,cls)=>h('div',{class:'card '+(cls||'')},h('div',{class:'l'},l),h('div',{class:'v'},v),h('div',{class:'s'},s||' '));
  async function load(){
    const d=new Date();d.setHours(0,0,0,0);
    const [ov,ro,q]=await Promise.all([api('GET','/v1/stats/overview?since='+encodeURIComponent(d.toISOString())),api('GET','/v1/agents/roster'),api('GET','/v1/sessions?status=queued&limit=20')]);
    const r=ov.rating;
    cards.replaceChildren(
      card('排队中',ov.queue.count,ov.queue.overdue?ov.queue.overdue+' 人已排队超时 · 最长 '+fmtDur(ov.queue.longest_wait):ov.queue.count?'最长已等 '+fmtDur(ov.queue.longest_wait):'没有人在排队',ov.queue.overdue?'bad':ov.queue.count?'warn':''),
      card('人工接待中',ov.live.active,'进行中的人工会话'),
      card('机器人接待中',ov.live.bot,'尚未转人工'),
      card('在线坐席',ov.agents.online+' / '+ov.agents.total,ov.agents.online?'':'当前没有在线坐席',ov.agents.online?'':'bad'),
      card('今日会话',ov.sessions.total,'其中人工接待 '+ov.sessions.human),
      card('今日消息',ov.messages,'访客与坐席发送'),
      card('今日满意度',r.count?r.avg.toFixed(2)+' 分':'-',r.count?r.count+' 条评价 · 满意率 '+Math.round(r.satisfaction_rate*100)+'%':'今日暂无评价',r.count&&r.avg>=4?'good':''));
    agents.replaceChildren(h('h3',{},'坐席负载'),ro.length?h('div',{class:'tablewrap'},h('table',{},h('thead',{},h('tr',{},['坐席','技能组','状态','接待'].map(x=>h('th',{},x)))),
      h('tbody',{},ro.map(a=>h('tr',{},h('td',{},a.name||a.accid,h('div',{class:'mut mono'},a.accid)),h('td',{},a.skill_group||'-'),
        h('td',{},h('span',{class:'dot '+(a.online?'on':'')}),a.online?'在线':'离线'),
        h('td',{},h('div',{class:'bar '+(a.load>=a.max_load?'full':'')},h('i',{style:'width:'+Math.min(100,a.load/a.max_load*100)+'%'})),h('span',{class:'mut'},a.load+' / '+a.max_load))))))):h('div',{class:'empty'},'还没有坐席，去“坐席”页添加'));
    queue.replaceChildren(h('h3',{},'排队中的会话'),q.length?h('div',{class:'tablewrap'},h('table',{},h('thead',{},h('tr',{},['会话','访客','技能组','已等待'].map(x=>h('th',{},x)))),
      h('tbody',{},q.map(s=>{const w=s.queued_at?(Date.now()-new Date(s.queued_at))/1000:0,late=ov.queue.alert_after>0&&w>=ov.queue.alert_after;
        return h('tr',{class:'click',onclick:()=>openSession(s.id)},h('td',{},'#'+s.id),h('td',{class:'mono'},s.visitor_accid),h('td',{},s.skill_group||'-'),h('td',{style:late?'color:var(--err);font-weight:600':''},s.queued_at?fmtDur(w)+(late?' ⚠':''):'-'))})))):h('div',{class:'empty'},'当前没有排队'))}
  await load();const t=setInterval(()=>load().catch(()=>{}),5000);return()=>clearInterval(t)}

/* ============ 会话 ============ */
async function pageSessions(root){
  const roster=await api('GET','/v1/agents/roster');
  let rows=[],more=false;
  const status=h('select',{},[['','全部状态'],['bot','机器人接待'],['queued','排队中'],['active','接待中'],['closed','已结束']].map(([v,t])=>h('option',{value:v},t)));
  const agent=h('select',{},h('option',{value:''},'全部坐席'),roster.map(a=>h('option',{value:a.accid},a.name||a.accid)));
  const visitor=h('input',{placeholder:'访客账号（精确）'});
  const tbody=h('tbody'),moreBtn=h('button',{class:'btn',onclick:()=>load(false)},'加载更多');
  async function load(reset){
    if(reset){rows=[]}
    const p=new URLSearchParams({limit:30});if(status.value)p.set('status',status.value);if(agent.value)p.set('agent',agent.value);if(visitor.value.trim())p.set('visitor',visitor.value.trim());
    if(rows.length)p.set('before',rows[rows.length-1].id);
    const list=await api('GET','/v1/sessions?'+p);rows.push(...list);more=list.length===30;draw()}
  function draw(){
    tbody.replaceChildren(...(rows.length?rows.map(s=>h('tr',{class:'click',onclick:()=>openSession(s.id)},h('td',{},'#'+s.id),h('td',{class:'mono'},s.visitor_accid),h('td',{},s.agent_accid||h('span',{class:'mut'},'—')),
      h('td',{},badge(s.status)),h('td',{style:'max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},s.last_msg||''),h('td',{class:'mut'},fmt(s.last_msg_at||s.created_at)))):[h('tr',{},h('td',{colspan:6,class:'empty'},'没有符合条件的会话'))]));
    moreBtn.hidden=!more}
  const q=h('button',{class:'btn primary',onclick:safe(()=>load(true))},'查询');
  visitor.onkeydown=e=>{if(e.key==='Enter')q.click()};
  const exportBtn=h('button',{class:'btn',onclick:()=>exportDialog({status:status.value,agent:agent.value,visitor:visitor.value.trim()})},'导出…');
  root.append(h('div',{class:'panel'},h('div',{class:'row',style:'margin-bottom:12px'},status,agent,visitor,q,h('span',{style:'flex:1'}),exportBtn),
    h('div',{class:'tablewrap'},h('table',{},h('thead',{},h('tr',{},['会话','访客','坐席','状态','最后一条消息','最后活动'].map(x=>h('th',{},x)))),tbody)),
    h('div',{class:'row',style:'justify-content:center;margin-top:12px'},moreBtn)));
  await load(true)}

/* ---- 导出：会话列表 / 聊天记录，CSV 或 JSONL ---- */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function downloadExport(kind,params){
  const r=await fetch('/v1/export/'+kind+'?'+params,{headers:{'X-App-Key':AUTH.ak,'X-App-Secret':AUTH.sec}}); // 认证走请求头，所以不能用普通链接下载
  if(r.status===401){logout('登录已失效，请重新登录');throw new Error('登录已失效')}
  if(!r.ok){let m='导出失败（'+r.status+'）';try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}
  const blob=await r.blob(),name=(/filename="([^"]+)"/.exec(r.headers.get('Content-Disposition')||'')||[])[1]||'export.csv';
  const a=h('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  return {name,size:blob.size}}
function exportDialog(filters){
  const kind=h('select',{},h('option',{value:'sessions'},'会话列表（每个会话一行：状态、评价、转接次数、消息数、时长）'),h('option',{value:'messages'},'聊天记录（每条消息一行）'));
  const fmtSel=h('select',{},h('option',{value:'csv'},'CSV（Excel/WPS 可直接打开）'),h('option',{value:'jsonl'},'JSONL（每行一个 JSON，便于程序处理）'));

        h('button',{class:'btn sm danger',onclick:safe(async()=>{if(await confirmBox('轮换后旧密钥立即失效，请同步更新你的服务器，否则会校验失败。','轮换')){await api('PUT','/v1/webhook',{url:w.url,rotate_secret:true});secretShown=true;await loadCfg()}})},'轮换')),
        h('pre',{class:'code'},'X-Kefu-Signature = "sha256=" + hex(HMAC_SHA256(secret, X-Kefu-Timestamp + "." + 请求体原文))\n事件按 event_id 去重；2xx 视为成功，否则按 10s/30s/2m/10m/30m/1h/3h 退避重试，共 8 次。')])}
  let rows=[],status='';
  const tbody=h('tbody'),moreBtn=h('button',{class:'btn',onclick:safe(()=>loadEv(false))},'加载更多');
  const sel=h('select',{onchange:safe(()=>{status=sel.value;return loadEv(true)})},[['','全部状态'],['pending','待投递'],['done','已送达'],['dead','投递失败'],['dropped','已丢弃']].map(([v,t])=>h('option',{value:v},t)));
  async function loadEv(reset){
    if(reset)rows=[];const p=new URLSearchParams({limit:30});if(status)p.set('status',status);if(rows.length)p.set('before',rows[rows.length-1].id);
    const l=await api('GET','/v1/webhook/events?'+p);rows.push(...l);moreBtn.hidden=l.length<30;
    tbody.replaceChildren(...(rows.length?rows.map(e=>h('tr',{},h('td',{class:'mono'},e.id),h('td',{},e.type),h('td',{},badge(e.status)),h('td',{},e.attempts),h('td',{class:'mut',style:'max-width:240px;word-break:break-all'},e.last_error||'—'),h('td',{class:'mut'},fmt(e.created_at)),
      h('td',{},e.status==='dead'&&h('button',{class:'btn sm',onclick:safe(async()=>{await api('POST','/v1/webhook/events/'+e.id+'/retry');toast('已重新加入投递队列');await loadEv(true)})},'重试')))):[h('tr',{},h('td',{colspan:7,class:'empty'},'暂无投递记录'))]))}
  evp.append(h('h3',{},'投递记录',h('span',{class:'row'},sel,h('button',{class:'btn',onclick:safe(()=>loadEv(true))},'刷新'))),
    h('div',{class:'tablewrap'},h('table',{},h('thead',{},h('tr',{},['事件 ID','类型','状态','尝试','最近错误','时间',''].map(x=>h('th',{},x)))),tbody)),h('div',{class:'row',style:'justify-content:center;margin-top:12px'},moreBtn));
  await Promise.all([loadCfg(),loadEv(true)])}

/* ============ 设置：排队超时 ============ */
async function pageSettings(root){
  const num=(v,min,max)=>h('input',{type:'number',min,max,value:v,style:'width:140px'});
  async function load(){
    const q=await api('GET','/v1/settings/queue');
    const f={remind_after:num(q.remind_after,0,86400),remind_every:num(q.remind_every,0,86400),remind_max:num(q.remind_max,0,20),alert_after:num(q.alert_after,0,86400),giveup_after:num(q.giveup_after,0,86400),
      remind_message:h('textarea',{rows:2,maxlength:200},q.remind_message),giveup_message:h('textarea',{rows:2,maxlength:200},q.giveup_message)};
    f.remind_message.value=q.remind_message;f.giveup_message.value=q.giveup_message;
    const read=()=>({remind_after:+f.remind_after.value||0,remind_every:+f.remind_every.value||0,remind_max:+f.remind_max.value||0,alert_after:+f.alert_after.value||0,giveup_after:+f.giveup_after.value||0,remind_message:f.remind_message.value.trim(),giveup_message:f.giveup_message.value.trim()});
    root.replaceChildren(h('div',{class:'panel'},h('h3',{},'排队超时处理',q.is_default&&h('span',{class:'badge'},'当前为默认设置')),
      h('p',{class:'mut',style:'margin-top:0'},'访客转人工后如果一直没有坐席接待，系统会按下面的规则处理。时间单位都是秒，填 0 表示关闭对应功能。'),
      h('div',{class:'sec'},'1. 提醒访客'),
      h('div',{class:'row'},field('排队多久后第一次提醒',f.remind_after,'0 = 不提醒'),field('之后每隔',f.remind_every,'至少 10 秒'),field('最多提醒几次',f.remind_max)),
      field('提醒内容',f.remind_message,'可用 {position}＝排队位置、{ahead}＝前面还有几位。会作为系统消息发给访客。'),
      h('div',{class:'sec'},'2. 超时告警（通知坐席和你的系统）'),
      field('排队多久算超时',f.alert_after,'到点后：在线坐席的工作台弹出提示、概览页标红，并触发 session.queue_timeout 回调。0 = 不告警'),
      h('div',{class:'sec'},'3. 放弃排队（可选）'),
      field('排队多久后放弃',f.giveup_after,'到点后把访客退回智能助手，并发送下面的话；访客可再次转人工重新排队。0 = 一直排队'),
      field('放弃时对访客说',f.giveup_message),
      h('div',{class:'row',style:'margin-top:8px'},h('button',{class:'btn primary',onclick:safe(async()=>{await api('PUT','/v1/settings/queue',read());toast('已保存');await load()})},'保存'),
        h('button',{class:'btn',onclick:safe(async()=>{if(await confirmBox('恢复为系统默认的排队超时设置？','恢复默认')){const d={remind_after:60,remind_every:60,remind_max:3,alert_after:180,giveup_after:0,remind_message:'',giveup_message:''};await api('PUT','/v1/settings/queue',d);toast('已恢复默认');await load()}})},'恢复默认'))),
      h('div',{class:'panel'},h('h3',{},'说明'),h('div',{class:'mut'},'• 排队时间从访客进入排队（或坐席把会话退回队列）的那一刻算起；被坐席接待、访客结束会话或放弃排队后停止。',h('br'),'• 系统每 5 秒检查一次，所以实际触发时间会有几秒误差。',h('br'),'• 每次提醒、每次告警都只会发一次，多台服务器同时运行也不会重复。')))}
  await load()}

/* ============ 接入 ============ */
async function pageAccess(root){
  const origin=location.origin,visitor=`${origin}/visitor.html?appkey=${TENANT.app_key}`;
  const row=(l,v)=>h('div',{class:'field'},h('label',{},l),h('div',{class:'row'},h('span',{class:'mono'},v),h('button',{class:'btn sm',onclick:()=>copy(v)},'复制')));
  root.append(h('div',{class:'panel'},h('h3',{},'接入信息'),row('App Key',TENANT.app_key),
      h('div',{class:'field'},h('label',{},'App Secret'),h('span',{class:'mut'},'仅用于你们的服务器调用接口，不要放进网页或 App 客户端。')),
      row('访客聊天页',visitor),row('坐席工作台',origin+'/agent.html'),row('管理后台',origin+'/admin.html')),
    h('div',{class:'panel'},h('h3',{},'嵌入网站'),h('p',{class:'mut'},'把下面的代码放进你的网页即可出现客服入口（iframe 方式）：'),
      h('pre',{class:'code'},`<iframe src="${visitor}"\n        style="position:fixed;right:20px;bottom:20px;width:380px;height:560px;border:0;border-radius:12px;box-shadow:0 8px 30px #0003"></iframe>`),
      h('button',{class:'btn',onclick:()=>copy(`<iframe src="${visitor}" style="position:fixed;right:20px;bottom:20px;width:380px;height:560px;border:0;border-radius:12px;box-shadow:0 8px 30px #0003"></iframe>`)},'复制代码')),
    h('div',{class:'panel'},h('h3',{},'服务端接口'),h('p',{class:'mut'},'所有接口都以 X-App-Key / X-App-Secret 认证，例如：'),
      h('pre',{class:'code'},`curl ${origin}/v1/agents/roster \\\n  -H "X-App-Key: ${TENANT.app_key}" -H "X-App-Secret: <你的 Secret>"`),
      h('p',{class:'mut',style:'margin-bottom:0'},'完整的接口、WebSocket 协议与回调事件见项目 README。')))}

/* ============ 启动 ============ */
if(AUTH){api('GET','/v1/tenant').then(t=>{TENANT=t;showShell()}).catch(()=>showLogin())}else showLogin();
</script></body></html>
