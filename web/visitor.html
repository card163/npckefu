<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在线客服</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:15px/1.5 -apple-system,"PingFang SC",sans-serif;background:#eef1f5;height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;background:#fff;display:flex;flex-direction:column;height:100%}
header{padding:12px 16px;background:#2f6bff;color:#fff;display:flex;justify-content:space-between;align-items:center}
header b{font-size:16px}#st{font-size:12px;opacity:.85}
#list{flex:1;overflow-y:auto;padding:12px;background:#f6f7fa}
.m{display:flex;margin:8px 0}.m.me{justify-content:flex-end}.m.sys{justify-content:center}
.m>div{max-width:75%;min-width:0}
.b{max-width:100%;padding:8px 12px;border-radius:12px;background:#fff;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px #0001}
.me .b{background:#2f6bff;color:#fff}.sys .b{background:none;box-shadow:none;color:#888;font-size:12px}
.who{font-size:11px;color:#999;margin:0 4px 2px}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid #e5e7eb}
#bar input{flex:1;padding:10px 12px;border:1px solid #d5d9e0;border-radius:20px;outline:none;font:inherit}
button{border:0;border-radius:20px;padding:0 18px;background:#2f6bff;color:#fff;font:inherit;cursor:pointer}
button.ghost{background:none;color:#fff;border:1px solid #fff8;padding:2px 10px;font-size:12px}
.b:has(img){padding:4px}
.b img{max-width:220px;max-height:220px;display:block;border-radius:6px;cursor:zoom-in}
.clip{cursor:pointer;font-size:20px;align-self:center;user-select:none}
#rate{padding:12px 16px;border-top:1px solid #e5e7eb;background:#fff}
#rate .rt{font-weight:600;margin-bottom:6px}
#stars{display:flex;gap:6px;font-size:30px;line-height:1;margin-bottom:8px}
#stars span{cursor:pointer;color:#d1d5db;user-select:none}#stars span.on{color:#f5a623}
#rc{width:100%;height:56px;padding:8px 10px;border:1px solid #d5d9e0;border-radius:8px;font:inherit;resize:none;outline:none}
#rate .rb{display:flex;gap:8px;margin-top:8px;align-items:center}
button.gh{background:#eef1f5;color:#555}#rm{font-size:12px;color:#d9534f;margin-left:4px}
#typing{height:18px;font-size:12px;color:#999;padding:0 16px}
</style></head><body>
<div id="app">
<header><div><b>在线客服</b><div id="st">连接中…</div></div><button class="ghost" id="end">结束会话</button></header>
<div id="list"></div><div id="rate" hidden><div class="rt">请为本次服务打分</div><div id="stars"></div>
<textarea id="rc" maxlength="500" placeholder="说说您的感受（选填）"></textarea>
<div class="rb"><button type="button" id="rs">提交评价</button><button type="button" class="gh" id="rk">跳过</button><span id="rm"></span></div></div>
<div id="typing"></div>
<form id="bar"><label class="clip" title="发送图片">📎<input type="file" id="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden></label><input id="in" placeholder="请输入消息，输入“转人工”联系客服" autocomplete="off"><button>发送</button></form>
</div>
<script>
const qs=new URLSearchParams(location.search), appkey=qs.get('appkey')||localStorage.getItem('appkey')||prompt('请输入 appkey');
localStorage.setItem('appkey',appkey);
const $=id=>document.getElementById(id), list=$('list');
let ws, sid=0, lastSeq=0, seen=new Set(), retry=0, tt;
const st=t=>$('st').textContent=t;

async function creds(){
  const k='visitor:'+appkey; let c=JSON.parse(localStorage.getItem(k)||'null');
  if(!c){const r=await fetch('/v1/visitors/register',{method:'POST',body:JSON.stringify({app_key:appkey,name:'访客'})});
    if(!r.ok){st('appkey 无效');throw 0} c=await r.json(); localStorage.setItem(k,JSON.stringify(c))}
  return c;
}
async function connect(){
  const c=await creds();
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+`/ws?appkey=${appkey}&accid=${c.accid}&token=${c.token}`);
  ws.onopen=()=>{retry=0;st('已连接');send({op:'start'})};
  ws.onclose=()=>{st('连接断开，重连中…');setTimeout(connect,Math.min(1000*2**retry++,15000))};
  ws.onmessage=e=>on(JSON.parse(e.data));
  setInterval(()=>ws.readyState===1&&send({op:'ping'}),20000);
}
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function on(ev){
  switch(ev.op){
  case 'session':
    sid=ev.session.id;
    if(ev.session.status==='closed'){const done=ev.session.id;st('会话已结束');sid=0;lastSeq=0;seen.clear();$('in').placeholder='会话已结束，发送消息可重新咨询';showRate(done)}
    else{st({bot:'机器人接待中',queued:'排队等待人工…',active:'人工客服服务中'}[ev.session.status]);
      send({op:'sync',session_id:sid,since_seq:lastSeq})}
    break;
  case 'msg': if(ev.message.session_id===sid) add(ev.message); break;
  case 'synced': ev.messages.forEach(add); break;
  case 'queue': st(ev.position>1?`排队中，前面还有 ${ev.position-1} 位`:'排队中，您是第 1 位'); break;
  case 'typing': $('typing').textContent='客服正在输入…';clearTimeout(tt);tt=setTimeout(()=>$('typing').textContent='',2500);break;
  case 'rated': $('rm').textContent='';$('rate').innerHTML='<div class="rt">感谢您的评价 🙏</div>';setTimeout(()=>{$('rate').hidden=true},1800);break;
  case 'error': if(!$('rate').hidden){$('rm').textContent=ev.error;break} sys('发送失败：'+ev.error); break;
  }
}
let rt;function markRead(){clearTimeout(rt);rt=setTimeout(()=>{if(sid&&lastSeq&&document.visibilityState==='visible')send({op:'read',session_id:sid,seq:lastSeq})},200)}
function fill(b,m){ // 文本直接显示；图片消息渲染为缩略图（点击新窗口看原图）。只接受服务端规范路径 /files/<32位hex>
  if(m.type==='image'){let i=null;try{i=JSON.parse(m.body)}catch(e){}
    if(i&&/^\/files\/[0-9a-f]{32}$/.test(i.url||'')){const a=document.createElement('a');a.href=i.url;a.target='_blank';a.rel='noopener';
      const im=document.createElement('img');im.src=i.url;im.loading='lazy';im.alt='图片';if(i.width&&i.height){im.width=Math.min(220,i.width);im.style.aspectRatio=i.width+'/'+i.height}
      a.append(im);b.append(a);return}
    b.textContent='[图片]';return}
  b.textContent=m.body}
async function sendImage(file){
  if(!file||!/^image\/(jpeg|png|gif|webp)$/.test(file.type))return sys('仅支持 JPG/PNG/GIF/WebP 图片');
  if(file.size>5*1024*1024)return sys('图片不能超过 5MB');
  if(!sid){send({op:'start'});return sys('正在开始新会话，请稍后重新发送图片')}
  const c=JSON.parse(localStorage.getItem('visitor:'+appkey)),fd=new FormData();fd.append('file',file);
  const r=await fetch('/v1/upload',{method:'POST',headers:{'X-App-Key':appkey,'X-Accid':c.accid,'X-Token':c.token},body:fd});
  if(!r.ok){const e=await r.json().catch(()=>({}));return sys('图片发送失败：'+(e.error||r.status))}
  const f=await r.json();
  send({op:'send',session_id:sid,client_msg_id:crypto.randomUUID(),type:'image',body:JSON.stringify({file_id:f.file_id})})}
$('file').onchange=e=>{sendImage(e.target.files[0]);e.target.value=''};
document.addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(it){e.preventDefault();sendImage(it.getAsFile())}});
// ---- 会话评价：会话结束后弹出，1~5 星 + 选填评语 ----
let rateSid=0,score=0;
const stars=[...Array(5)].map((_,i)=>{const s=document.createElement('span');s.textContent='★';s.onclick=()=>{score=i+1;paint()};$('stars').append(s);return s});
const paint=()=>stars.forEach((s,i)=>s.classList.toggle('on',i<score));
function showRate(id){rateSid=id;score=0;paint();$('rc').value='';$('rm').textContent='';$('rate').hidden=false;list.scrollTop=list.scrollHeight}
$('rs').onclick=()=>{if(!score)return $('rm').textContent='请先选择星级';send({op:'rate',session_id:rateSid,score,comment:$('rc').value})};
$('rk').onclick=()=>{$('rate').hidden=true};
function add(m){
  if(seen.has(m.seq))return; seen.add(m.seq); lastSeq=Math.max(lastSeq,m.seq); markRead();
  if(m.from_role==='system')return sys(m.body);
  const me=m.from_role==='visitor', d=document.createElement('div'); d.className='m'+(me?' me':'');
  const w=document.createElement('div'), b=document.createElement('div'); b.className='b'; fill(b,m);
  if(!me){const who=document.createElement('div');who.className='who';who.textContent=m.from_role==='bot'?'智能助手':'人工客服';w.append(who)}
  w.append(b); d.append(w); list.append(d); list.scrollTop=list.scrollHeight;
}
function sys(t){const d=document.createElement('div');d.className='m sys';const b=document.createElement('div');b.className='b';b.textContent=t;d.append(b);list.append(d);list.scrollTop=list.scrollHeight}
$('bar').onsubmit=e=>{e.preventDefault();const v=$('in').value.trim();if(!v)return;
  if(!sid){send({op:'start'});return sys('正在开始新会话，请重新发送')}
  send({op:'send',session_id:sid,client_msg_id:crypto.randomUUID(),type:'text',body:v});$('in').value=''};
$('in').oninput=()=>sid&&send({op:'typing',session_id:sid});
$('end').onclick=()=>sid&&confirm('确定结束会话？')&&send({op:'close',session_id:sid});
connect();
</script></body></html>
