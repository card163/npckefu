<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>客服工作台</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:14px/1.5 -apple-system,"PingFang SC",sans-serif;height:100vh;display:flex;flex-direction:column;background:#f0f2f5}
#top{background:#1f2a44;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
#main{flex:1;display:flex;min-height:0}
#side{width:260px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto}
.s{padding:12px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;justify-content:space-between}
.s.on{background:#e8f0ff}.s small{color:#999;display:block}
.badge{background:#f43f5e;color:#fff;border-radius:10px;padding:0 7px;font-size:12px;height:20px}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:10px 16px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
#msgs{flex:1;overflow-y:auto;padding:14px}
.m{display:flex;margin:8px 0}.m.me{justify-content:flex-end}.m.sys{justify-content:center}
.m>div{max-width:70%;min-width:0}
.b{max-width:100%;padding:8px 12px;border-radius:10px;background:#fff;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px #0001}
.me .b{background:#2f6bff;color:#fff}.sys .b{background:none;box-shadow:none;color:#888;font-size:12px}
.tag{font-size:11px;color:#999;margin:0 4px 2px}
#bar{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #e5e7eb}
#bar input{flex:1;padding:9px 12px;border:1px solid #d5d9e0;border-radius:6px;font:inherit;outline:none}
button{border:0;border-radius:6px;padding:8px 18px;background:#2f6bff;color:#fff;font:inherit;cursor:pointer}
button.d{background:#e5e7eb;color:#333}
#login{margin:80px auto;background:#fff;padding:24px;border-radius:10px;width:340px;display:flex;flex-direction:column;gap:10px}
#login input{padding:9px;border:1px solid #d5d9e0;border-radius:6px;font:inherit}
.b:has(img){padding:4px}
.b img{max-width:220px;max-height:220px;display:block;border-radius:6px;cursor:zoom-in}
.clip{cursor:pointer;font-size:20px;align-self:center;user-select:none}
#toasts{position:fixed;top:56px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:9}
.toast{background:#1f2a44;color:#fff;padding:10px 14px;border-radius:8px;max-width:320px;box-shadow:0 4px 12px #0003;word-break:break-word}
.toast b{color:#f5a623;letter-spacing:2px}
#head{gap:8px}#head button{white-space:nowrap}
#xfer-mask{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:20}
#xfer{background:#fff;border-radius:10px;padding:18px;width:380px;max-width:92vw;display:flex;flex-direction:column;gap:10px}
#xfer h3{margin:0}#xfer select,#xfer textarea{padding:8px;border:1px solid #d5d9e0;border-radius:6px;font:inherit;width:100%}
#xfer textarea{height:70px;resize:none}#xfer .row{display:flex;gap:8px;justify-content:flex-end}
#xfer small{color:#888}
.empty{margin:auto;color:#999}
</style></head><body>
<form id="login"><h3 style="margin:0">坐席登录</h3>
<input id="ak" placeholder="appkey" required><input id="ac" placeholder="accid" required><input id="tk" placeholder="token" required><button>登录</button></form>
<div id="toasts"></div>
<div id="xfer-mask" hidden><div id="xfer"><h3>转接会话</h3>
  <select id="xt"></select>
  <textarea id="xn" maxlength="500" placeholder="转接备注（选填，仅接手的同事可见，访客看不到）"></textarea>
  <small id="xh"></small>
  <div class="row"><button type="button" class="d" id="xc">取消</button><button type="button" id="xok">确认转接</button></div></div></div>
<div id="top" hidden><b>客服工作台 · <span id="me"></span></b><span id="st">连接中…</span></div>
<div id="main" hidden>
  <div id="side"></div>
  <div id="chat"><div class="empty" id="empty">选择左侧会话开始接待</div>
    <div id="head" hidden><span id="title"></span><span><button class="d" id="xferbtn">转接</button> <button class="d" id="end">结束会话</button></span></div>
    <div id="msgs" hidden></div>
    <form id="bar" hidden><label class="clip" title="发送图片">📎<input type="file" id="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden></label><input id="in" placeholder="输入回复，回车发送" autocomplete="off"><button>发送</button></form>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const S={}, cur={id:0}; let ws, retry=0, cfg;
const saved=JSON.parse(localStorage.getItem('agent')||'null'); if(saved){ak.value=saved.ak;ac.value=saved.ac;tk.value=saved.tk}
$('login').onsubmit=e=>{e.preventDefault();cfg={ak:ak.value.trim(),ac:ac.value.trim(),tk:tk.value.trim()};localStorage.setItem('agent',JSON.stringify(cfg));
  $('login').hidden=true;$('top').hidden=false;$('main').hidden=false;$('me').textContent=cfg.ac;connect()};
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+`/ws?appkey=${cfg.ak}&accid=${cfg.ac}&token=${cfg.tk}`);
  ws.onopen=()=>{retry=0;$('st').textContent='在线';send({op:'recent'});Object.values(S).forEach(s=>send({op:'sync',session_id:s.info.id,since_seq:s.last}))};
  ws.onclose=ev=>{$('st').textContent='离线，重连中…';setTimeout(connect,Math.min(1000*2**retry++,15000))};
  ws.onmessage=e=>on(JSON.parse(e.data));
}
setInterval(()=>ws&&ws.readyState===1&&send({op:'ping'}),20000);
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function on(ev){
  if(ev.op==='session'){const x=ev.session;
    if(x.status!=='active'||x.agent_accid!==cfg.ac){delete S[x.id];if(cur.id===x.id){cur.id=0}return render()} // 已结束、已转走或退回队列
    if(!S[x.id]){S[x.id]={info:x,msgs:[],seen:new Set(),last:0,unread:0};send({op:'sync',session_id:x.id,since_seq:0})} else S[x.id].info=x;
    if(!cur.id)cur.id=x.id; render()}
  else if(ev.op==='recent'){ // 服务端最近会话：未读数以服务端为准（刷新/换设备后不丢）
    ev.recent.forEach(it=>{if(it.status!=='active'||it.agent_accid!==cfg.ac)return;
      if(!S[it.id]){S[it.id]={info:it,msgs:[],seen:new Set(),last:0,unread:0};send({op:'sync',session_id:it.id,since_seq:0})}
      S[it.id].unread=it.id===cur.id?0:it.unread});
    if(!cur.id&&ev.recent.length){const f=ev.recent.find(x=>x.status!=='closed');if(f)cur.id=f.id}
    markRead();render()}
  else if(ev.op==='read'){const s=S[ev.session_id];if(s&&ev.seq>=s.last){s.unread=0;render()}}
  else if(ev.op==='msg')add(ev.message,true);
  else if(ev.op==='synced')ev.messages.forEach(m=>add(m,false));
  else if(ev.op==='typing'&&ev.session_id===cur.id){$('title').dataset.t=1;setTimeout(()=>delete $('title').dataset.t,2500);render()}
  else if(ev.op==='agents')fillRoster(ev.agents||[]);
  else if(ev.op==='transfer_ok'){$('xfer-mask').hidden=true}
  else if(ev.op==='transferred'){toast('会话 #'+ev.session_id+' 由 '+ev.from+' 转入'+(ev.note?'：'+ev.note:''))}
  else if(ev.op==='queue_alert'){const s=ev.wait||0;toast('⏰ 会话 #'+ev.session_id+' 的访客已排队 '+(s<60?s+' 秒':Math.floor(s/60)+' 分 '+(s%60)+' 秒')+'，排在第 '+ev.position+' 位，有空请尽快接待')}
  else if(ev.op==='rated'){const t=document.createElement('div');t.className='toast';const b=document.createElement('b');b.textContent='★'.repeat(ev.score)+'☆'.repeat(5-ev.score);
    t.append('访客 '+ev.from+' 评价了会话 #'+ev.session_id+'：',b);if(ev.comment)t.append('  '+ev.comment);$('toasts').append(t);setTimeout(()=>t.remove(),10000)}
  else if(ev.op==='error')alert(ev.error);
}
function fill(b,m){ // 文本直接显示；图片消息渲染为缩略图（点击新窗口看原图）。只接受服务端规范路径 /files/<32位hex>
  if(m.type==='image'){let i=null;try{i=JSON.parse(m.body)}catch(e){}
    if(i&&/^\/files\/[0-9a-f]{32}$/.test(i.url||'')){const a=document.createElement('a');a.href=i.url;a.target='_blank';a.rel='noopener';
      const im=document.createElement('img');im.src=i.url;im.loading='lazy';im.alt='图片';if(i.width&&i.height){im.width=Math.min(220,i.width);im.style.aspectRatio=i.width+'/'+i.height}
      a.append(im);b.append(a);return}
    b.textContent='[图片]';return}
  b.textContent=m.body}
async function sendImage(file){
  if(!cur.id)return;
  if(!file||!/^image\/(jpeg|png|gif|webp)$/.test(file.type))return alert('仅支持 JPG/PNG/GIF/WebP 图片');
  if(file.size>5*1024*1024)return alert('图片不能超过 5MB');
  const fd=new FormData();fd.append('file',file);
  const r=await fetch('/v1/upload',{method:'POST',headers:{'X-App-Key':cfg.ak,'X-Accid':cfg.ac,'X-Token':cfg.tk},body:fd});
  if(!r.ok){const e=await r.json().catch(()=>({}));return alert('图片发送失败：'+(e.error||r.status))}
  const f=await r.json();
  send({op:'send',session_id:cur.id,client_msg_id:crypto.randomUUID(),type:'image',body:JSON.stringify({file_id:f.file_id})})}
$('file').onchange=e=>{sendImage(e.target.files[0]);e.target.value=''};
document.addEventListener('paste',e=>{if(document.activeElement&&document.activeElement.id==='login')return;const it=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'));if(it){e.preventDefault();sendImage(it.getAsFile())}});
let rt;function markRead(){clearTimeout(rt);rt=setTimeout(()=>{const s=S[cur.id];if(s&&s.last&&document.visibilityState==='visible')send({op:'read',session_id:cur.id,seq:s.last})},200)}
function add(m,live){const s=S[m.session_id];if(!s||s.seen.has(m.seq))return;s.seen.add(m.seq);s.msgs.push(m);s.msgs.sort((a,b)=>a.seq-b.seq);s.last=Math.max(s.last,m.seq);
  if(live&&m.from_role==='visitor'&&m.session_id!==cur.id)s.unread++;
  if(m.session_id===cur.id)markRead();render()}
function render(){
  const side=$('side');side.replaceChildren();
  Object.values(S).sort((a,b)=>b.info.id-a.info.id).forEach(s=>{
    const d=document.createElement('div');d.className='s'+(s.info.id===cur.id?' on':'');
    const l=document.createElement('div'),last=s.msgs.filter(m=>m.from_role==='visitor').pop();
    l.textContent=s.info.visitor_accid;const sm=document.createElement('small');sm.textContent=last?(last.type==='image'?'[图片]':last.body.slice(0,24)):'新会话';l.append(sm);d.append(l);
    if(s.unread){const b=document.createElement('span');b.className='badge';b.textContent=s.unread;d.append(b)}
    d.onclick=()=>{cur.id=s.info.id;s.unread=0;markRead();render()};side.append(d)});
  const s=S[cur.id],has=!!s;
  $('empty').hidden=has;$('head').hidden=$('msgs').hidden=$('bar').hidden=!has;if(!has)return;
  $('title').textContent=s.info.visitor_accid+($('title').dataset.t?'（正在输入…）':'');
  const box=$('msgs');box.replaceChildren();
  s.msgs.forEach(m=>{const d=document.createElement('div');const me=m.from_role==='agent';
    d.className='m'+(me?' me':m.from_role==='system'?' sys':'');const w=document.createElement('div'),b=document.createElement('div');b.className='b';fill(b,m);
    if(!me&&m.from_role!=='system'){const t=document.createElement('div');t.className='tag';t.textContent={visitor:'访客',bot:'机器人'}[m.from_role]||m.from_role;w.append(t)}
    w.append(b);d.append(w);box.append(d)});
  box.scrollTop=box.scrollHeight;
}
$('bar').onsubmit=e=>{e.preventDefault();const v=$('in').value.trim();if(!v||!cur.id)return;
  send({op:'send',session_id:cur.id,client_msg_id:crypto.randomUUID(),type:'text',body:v});$('in').value=''};
$('in').oninput=()=>cur.id&&send({op:'typing',session_id:cur.id});
function toast(text){const t=document.createElement('div');t.className='toast';t.textContent=text;$('toasts').append(t);setTimeout(()=>t.remove(),12000)}
// ---- 转接：指定在线同事 / 技能组 / 退回队列 ----
function fillRoster(list){
  const sel=$('xt');sel.replaceChildren();const add=(v,t,dis)=>{const o=document.createElement('option');o.value=v;o.textContent=t;o.disabled=!!dis;sel.append(o)};
  const groups=new Set();
  list.filter(a=>a.accid!==cfg.ac).forEach(a=>{if(a.skill_group)groups.add(a.skill_group);
    add('agent:'+a.accid,`${a.name||a.accid}${a.skill_group?' ['+a.skill_group+']':''}  ${a.online?'在线':'离线'} ${a.load}/${a.max_load}`,!a.online||a.load>=a.max_load)});
  groups.forEach(g=>add('group:'+g,'转到技能组：'+g));
  add('queue:','退回队列（交给其他坐席）');
  const first=[...sel.options].find(o=>!o.disabled);if(first)sel.value=first.value;
  $('xh').textContent='灰色项：对方离线或已满载，不能直接转。技能组/退回队列会重新排队，且不会分回给你。'}
$('xferbtn').onclick=()=>{if(!cur.id)return;$('xn').value='';$('xt').replaceChildren();$('xfer-mask').hidden=false;send({op:'agents'})};
$('xc').onclick=()=>{$('xfer-mask').hidden=true};
$('xok').onclick=()=>{const v=$('xt').value;if(!v||!cur.id)return;const [k,id]=[v.slice(0,v.indexOf(':')),v.slice(v.indexOf(':')+1)];
  const m={op:'transfer',session_id:cur.id,note:$('xn').value};if(k==='agent')m.to_agent=id;if(k==='group')m.skill_group=id;send(m)};
$('end').onclick=()=>cur.id&&confirm('确定结束该会话？')&&send({op:'close',session_id:cur.id});
if(saved&&new URLSearchParams(location.search).has('auto'))$('login').requestSubmit();
</script></body></html>
